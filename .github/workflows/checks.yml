name: Checks
on:
  push:
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'install.ps1'
      - 'bootstrap.ps1'
      - 'requirements.txt'
      - '.github/workflows/checks.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'install.ps1'
      - 'bootstrap.ps1'
      - 'requirements.txt'
      - '.github/workflows/checks.yml'
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      install: ${{ steps.filter.outputs.install }}
      host: ${{ steps.filter.outputs.host }}
      mcp: ${{ steps.filter.outputs.mcp }}
      native: ${{ steps.filter.outputs.native }}
      runner: ${{ steps.filter.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            install:
              - 'install.ps1'
              - 'bootstrap.ps1'
              - 'scripts/install.py'
              - 'scripts/doctor.py'
              - 'scripts/launch.ps1'
              - 'scripts/package_release.py'
              - 'tests/test_install.py'
              - 'tests/test_bootstrap.py'
              - 'tests/test_launcher.py'
              - '.github/workflows/checks.yml'
            host:
              - 'scripts/run_bridge.py'
              - 'requirements.txt'
              - 'tests/test_host.py'
            mcp:
              - 'scripts/run_mcp.py'
              - 'scripts/client.py'
              - 'tests/test_mcp.py'
            native:
              - 'src/**'
              - 'tests/*.cjs'
            runner:
              - 'scripts/play_story.py'
              - 'tests/test_story_runner.py'
  python:
    needs: changes
    if: needs.changes.outputs.install == 'true' || needs.changes.outputs.host == 'true' || needs.changes.outputs.mcp == 'true' || needs.changes.outputs.runner == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - if: needs.changes.outputs.host == 'true'
        run: python -m pip install -r requirements.txt
      - if: needs.changes.outputs.install == 'true'
        run: |
          python -X utf8 -m unittest discover -s tests -p test_install.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s tests -p test_bootstrap.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s tests -p test_launcher.py -v
      - if: needs.changes.outputs.host == 'true'
        run: python -X utf8 -m unittest discover -s tests -p test_host.py -v
      - if: needs.changes.outputs.mcp == 'true'
        run: python -X utf8 -m unittest discover -s tests -p test_mcp.py -v
      - if: needs.changes.outputs.runner == 'true'
        run: python -X utf8 -m unittest discover -s tests -p test_story_runner.py -v
  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_bridge.cjs
      - run: node tests/test_story.cjs
      - run: node tests/test_sun_hazards.cjs
